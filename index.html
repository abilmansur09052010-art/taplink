<!DOCTYPE html>

    <meta charset="UTF-8">

    <title>KICKSERA | Магазин Ретро Футболок</title>
    <style>
        /* Главные стили премиальной мобильной визитки */
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0b; /* Глубокий черный фон */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        /* Основной контейнер под мобильный экран */
        .container {
            width: 100%;
            max-width: 480px;
            padding: 25px 15px;
            box-sizing: border-box;
            text-align: center;
        }

        /* Круглое лого (Аватарка) */
        .logo-wrapper {
            width: 110px;
            height: 110px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #25d366; /* Зеленая фирменная рамка */
            box-shadow: 0 0 15px rgba(37, 211, 102, 0.2);
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Заголовки */
        .shop-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 0 0 5px 0;
            text-transform: uppercase;
        }

        .shop-subtitle {
            font-size: 14px;
            color: #aaaaaa;
            margin: 0 0 25px 0;
        }

        /* Главная кнопка WhatsApp */
        .whatsapp-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #25d366; /* Зеленый цвет WhatsApp */
            color: #ffffff;
            text-decoration: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 35px;
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3);
            transition: transform 0.2s ease;
        }

        .whatsapp-btn:active {
            transform: scale(0.98);
        }

        .whatsapp-btn svg {
            width: 24px;
            height: 24px;
            margin-right: 10px;
            fill: #ffffff;
        }

        /* Заголовок каталога */
        .section-title {
            font-size: 18px;
            font-weight: 700;
            text-align: left;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-left: 3px solid #25d366;
            padding-left: 10px;
        }

        /* Сетка каталога товаров */
        .catalog-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        /* Карточка товара */
        .product-card {
            background-color: #161616; /* Темная подложка карточек */
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #222222;
        }

        .product-img-wrapper {
            width: 100%;
            padding-top: 100%; /* Пропорции 1:1 */
            position: relative;
            background-color: #222222;
        }

        .product-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            text-align: left;
        }

        .product-name {
            font-size: 13px;
            font-weight: 600;
            margin: 0 0 6px 0;
            color: #ffffff;
            min-height: 34px;
        }

        .product-price {
            font-size: 14px;
            font-weight: 700;
            color: #25d366;
            margin: 0 0 12px 0;
        }

        /* Кнопка заказа под товаром */
        .buy-btn {
            background-color: #ffffff;
            color: #000000;
            text-decoration: none;
            text-align: center;
            padding: 10px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: auto;
        }
    </style>
</head>
